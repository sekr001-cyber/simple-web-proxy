<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Proxy</title>

<style>

:root {
    --bg: #ffffff;
    --text: #202124;
    --muted: #70757a;
    --border: #dadce0;
    --button: #f8f9fa;
    --button-hover: #f1f3f4;
    --footer: #f2f2f2;
    --blue: #4285f4;
}

body.dark {
    --bg: #202124;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #3c4043;
    --button: #303134;
    --button-hover: #3c4043;
    --footer: #171717;
    --blue: #8ab4f8;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        background .2s ease,
        color .2s ease;
}


/* =========================================
   HEADER
========================================= */

header {

    height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    border-bottom:
        1px solid var(--border);
}

.header-left,
.header-right {

    display: flex;
    align-items: center;

    gap: 8px;
}

.mini-logo {

    color: var(--text);

    font-size: 18px;

    font-weight: 600;

    text-decoration: none;

    cursor: pointer;
}

.nav-button {

    height: 36px;

    padding: 0 12px;

    border: 0;

    border-radius: 5px;

    background: transparent;

    color: var(--text);

    cursor: pointer;

    font-size: 13px;
}

.nav-button:hover {

    background:
        var(--button-hover);
}


/* =========================================
   MAIN
========================================= */

main {

    width:
        min(
            760px,
            calc(100% - 32px)
        );

    margin:
        0 auto;

    padding-top:
        125px;

    text-align:
        center;
}


/* =========================================
   LOGO
========================================= */

.logo {

    margin-bottom:
        32px;

    font-size:
        62px;

    font-weight:
        500;

    letter-spacing:
        -4px;
}

.logo .blue {
    color: #4285f4;
}

.logo .red {
    color: #ea4335;
}

.logo .yellow {
    color: #fbbc05;
}

.logo .green {
    color: #34a853;
}

.logo .proxy {

    color:
        var(--text);

    letter-spacing:
        -2px;
}


/* =========================================
   SEARCH
========================================= */

.search-box {

    height:
        52px;

    display:
        flex;

    align-items:
        center;

    padding:
        0 8px 0 18px;

    border:
        1px solid var(--border);

    border-radius:
        28px;

    background:
        var(--bg);

    box-shadow:
        0 1px 6px
        rgba(32,33,36,.15);

    transition:
        box-shadow .15s ease;
}

.search-box:hover,
.search-box:focus-within {

    box-shadow:
        0 1px 10px
        rgba(32,33,36,.22);
}

.search-icon {

    margin-right:
        12px;

    color:
        var(--muted);

    font-size:
        19px;
}

#search {

    flex:
        1;

    min-width:
        0;

    height:
        100%;

    border:
        0;

    outline:
        0;

    background:
        transparent;

    color:
        var(--text);

    font-size:
        16px;
}

#search::placeholder {

    color:
        var(--muted);
}

.clear-button {

    width:
        36px;

    height:
        36px;

    border:
        0;

    background:
        transparent;

    color:
        var(--muted);

    font-size:
        20px;

    cursor:
        pointer;

    display:
        none;
}

.clear-button.visible {

    display:
        block;
}


/* =========================================
   MAIN BUTTONS
========================================= */

.buttons {

    margin-top:
        28px;

    display:
        flex;

    justify-content:
        center;

    gap:
        10px;

    flex-wrap:
        wrap;
}

.action-button {

    padding:
        10px 17px;

    border:
        1px solid var(--button);

    border-radius:
        5px;

    background:
        var(--button);

    color:
        var(--text);

    cursor:
        pointer;

    font-size:
        14px;
}

.action-button:hover {

    border-color:
        var(--border);

    background:
        var(--button-hover);
}


/* =========================================
   TOOLS
========================================= */

.tools {

    margin-top:
        28px;

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        6px;
}

.tool {

    padding:
        7px 10px;

    border:
        0;

    border-radius:
        5px;

    background:
        transparent;

    color:
        var(--blue);

    cursor:
        pointer;

    font-size:
        13px;
}

.tool:hover {

    text-decoration:
        underline;
}


/* =========================================
   STATUS
========================================= */

#status {

    min-height:
        22px;

    margin-top:
        30px;

    color:
        var(--muted);

    font-size:
        13px;
}


/* =========================================
   QUICK PANEL
========================================= */

.panel {

    display:
        none;

    margin-top:
        35px;

    padding:
        18px;

    border:
        1px solid var(--border);

    border-radius:
        10px;

    background:
        var(--bg);

    text-align:
        left;
}

.panel.visible {

    display:
        block;
}

.panel-title {

    margin-bottom:
        14px;

    font-size:
        15px;

    font-weight:
        600;
}

.panel-empty {

    color:
        var(--muted);

    font-size:
        13px;
}

.panel-item {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    padding:
        10px 0;

    border-bottom:
        1px solid var(--border);
}

.panel-item:last-child {

    border-bottom:
        0;
}

.panel-item-main {

    min-width:
        0;
}

.panel-item-title {

    color:
        var(--blue);

    cursor:
        pointer;

    font-size:
        14px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}

.panel-item-url {

    margin-top:
        3px;

    color:
        var(--muted);

    font-size:
        11px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}

.small-delete {

    flex:
        0 0 auto;

    border:
        0;

    background:
        transparent;

    color:
        var(--muted);

    cursor:
        pointer;
}


/* =========================================
   FOOTER
========================================= */

footer {

    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    min-height:
        44px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-top:
        1px solid var(--border);

    background:
        var(--footer);

    color:
        var(--muted);

    font-size:
        13px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    header {

        padding:
            0 12px;
    }

    .header-right {

        gap:
            0;
    }

    .nav-button {

        padding:
            0 7px;
    }

    main {

        padding-top:
            90px;
    }

    .logo {

        font-size:
            48px;
    }

    .buttons {

        flex-direction:
            column;

        align-items:
            center;
    }

    .action-button {

        width:
            210px;
    }

    .panel {

        margin-bottom:
            60px;
    }
}

</style>

</head>

<body>


<header>

    <div class="header-left">

        <a
            class="mini-logo"
            href="/">

            Simple Proxy

        </a>

    </div>


    <div class="header-right">

        <button
            class="nav-button"
            onclick="togglePanel('history')">

            Historik

        </button>

        <button
            class="nav-button"
            onclick="togglePanel('bookmarks')">

            Bokmärken

        </button>

        <button
            class="nav-button"
            onclick="toggleDarkMode()">

            🌙

        </button>

    </div>

</header>


<main>


    <div class="logo">

        <span class="blue">S</span><span class="red">i</span><span class="yellow">m</span><span class="blue">p</span><span class="green">l</span><span class="red">e</span>

        <span class="proxy">
            Proxy
        </span>

    </div>


    <form id="searchForm">

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="Sök eller skriv en webbadress"
            >

            <button
                id="clearButton"
                class="clear-button"
                type="button">

                ×

            </button>

        </div>

    </form>


    <div class="buttons">

        <button
            class="action-button"
            onclick="searchDuckDuckGo()">

            🔎 DuckDuckGo

        </button>

        <button
            class="action-button"
            onclick="openInputAsUrl()">

            🌐 Öppna URL

        </button>

        <button
            class="action-button"
            onclick="openExample()">

            🧪 Testa

        </button>

    </div>


    <div class="tools">

        <button
            class="tool"
            onclick="goHome()">

            🏠 Hem

        </button>

        <button
            class="tool"
            onclick="copyCurrentUrl()">

            📋 Kopiera adress

        </button>

        <button
            class="tool"
            onclick="checkStatus()">

            ⚡ Serverstatus

        </button>

    </div>


    <div id="status">

        Sök på webben eller öppna en webbadress genom proxyn.

    </div>


    <div
        id="historyPanel"
        class="panel">

        <div class="panel-title">
            🕘 Historik
        </div>

        <div id="historyContent"></div>

    </div>


    <div
        id="bookmarksPanel"
        class="panel">

        <div class="panel-title">
            ⭐ Bokmärken
        </div>

        <div id="bookmarksContent"></div>

    </div>


</main>


<footer>

    Simple Proxy · V22

</footer>


<script>

/* =========================================
   ELEMENTS
========================================= */

const input =
    document.getElementById(
        "search"
    );

const form =
    document.getElementById(
        "searchForm"
    );

const clearButton =
    document.getElementById(
        "clearButton"
    );

const status =
    document.getElementById(
        "status"
    );

const historyPanel =
    document.getElementById(
        "historyPanel"
    );

const bookmarksPanel =
    document.getElementById(
        "bookmarksPanel"
    );

const historyContent =
    document.getElementById(
        "historyContent"
    );

const bookmarksContent =
    document.getElementById(
        "bookmarksContent"
    );


/* =========================================
   URL
========================================= */

function isUrl(value) {

    if (!value) {
        return false;
    }

    if (
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ) {
        return true;
    }

    return (
        value.includes(".") &&
        !value.includes(" ")
    );
}


function normalizeUrl(value) {

    if (
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ) {
        return value;
    }

    return "https://" + value;
}


function openThroughProxy(url) {

    window.location.href =
        "/proxy?url=" +
        encodeURIComponent(url);
}


/* =========================================
   SEARCH
========================================= */

function searchDuckDuckGo() {

    const value =
        input.value.trim();

    if (!value) {

        input.focus();

        return;
    }

    const url =
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(value);

    status.textContent =
        "Öppnar DuckDuckGo genom proxyn...";

    openThroughProxy(url);
}


/* =========================================
   OPEN URL
========================================= */

function openInputAsUrl() {

    const value =
        input.value.trim();

    if (!value) {

        input.focus();

        return;
    }

    if (!isUrl(value)) {

        status.textContent =
            "Skriv en webbadress, exempelvis example.com";

        return;
    }

    openThroughProxy(
        normalizeUrl(value)
    );
}


/* =========================================
   FORM
========================================= */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const value =
            input.value.trim();

        if (!value) {
            return;
        }

        if (isUrl(value)) {

            openThroughProxy(
                normalizeUrl(value)
            );

        } else {

            searchDuckDuckGo();

        }
    }
);


/* =========================================
   CLEAR
========================================= */

input.addEventListener(
    "input",
    function() {

        clearButton.style.display =
            input.value
                ? "block"
                : "none";

    }
);

clearButton.addEventListener(
    "click",
    function() {

        input.value = "";

        clearButton.style.display =
            "none";

        input.focus();

    }
);


/* =========================================
   HOME
========================================= */

function goHome() {

    window.location.href = "/";

}


/* =========================================
   EXAMPLE
========================================= */

function openExample() {

    openThroughProxy(
        "https://example.com/"
    );

}


/* =========================================
   COPY URL
========================================= */

async function copyCurrentUrl() {

    try {

        await navigator.clipboard.writeText(
            window.location.href
        );

        status.textContent =
            "Adressen kopierades.";

    } catch {

        status.textContent =
            "Kunde inte kopiera adressen.";

    }

}


/* =========================================
   DARK MODE
========================================= */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );

    const enabled =
        document.body.classList.contains(
            "dark"
        );

    localStorage.setItem(
        "simpleProxyDark",
        enabled
            ? "1"
            : "0"
    );

}


/* =========================================
   LOAD DARK MODE
========================================= */

if (
    localStorage.getItem(
        "simpleProxyDark"
    ) === "1"
) {

    document.body.classList.add(
        "dark"
    );
}


/* =========================================
   STATUS
========================================= */

async function checkStatus() {

    status.textContent =
        "Kontrollerar servern...";

    try {

        const response =
            await fetch(
                "/health",
                {
                    cache:
                        "no-store"
                }
            );

        const data =
            await response.json();

        status.textContent =
            `Server online · ${data.version} · uptime ${data.uptime}s`;

    } catch {

        status.textContent =
            "Servern kunde inte kontaktas.";

    }
}


/* =========================================
   PANELS
========================================= */

function togglePanel(type) {

    if (type === "history") {

        bookmarksPanel.classList.remove(
            "visible"
        );

        historyPanel.classList.toggle(
            "visible"
        );

        if (
            historyPanel.classList.contains(
                "visible"
            )
        ) {
            loadHistory();
        }

        return;
    }

    if (type === "bookmarks") {

        historyPanel.classList.remove(
            "visible"
        );

        bookmarksPanel.classList.toggle(
            "visible"
        );

        if (
            bookmarksPanel.classList.contains(
                "visible"
            )
        ) {
            loadBookmarks();
        }

    }
}


/* =========================================
   HISTORY
========================================= */

async function loadHistory() {

    historyContent.innerHTML =
        `<div class="panel-empty">
            Laddar...
        </div>`;

    try {

        const response =
            await fetch(
                "/api/session"
            );

        const data =
            await response.json();

        const history =
            data.history || [];

        if (!history.length) {

            historyContent.innerHTML =
                `<div class="panel-empty">
                    Ingen historik ännu.
                </div>`;

            return;
        }

        historyContent.innerHTML =
            history
                .slice(0, 20)
                .map(item => {

                    const safeUrl =
                        escapeHtml(
                            item.url
                        );

                    return `
                        <div class="panel-item">

                            <div class="panel-item-main">

                                <div
                                    class="panel-item-title"
                                    onclick="openHistory(${JSON.stringify(item.url)})">

                                    ${safeUrl}

                                </div>

                                <div class="panel-item-url">

                                    ${item.status}
                                    ·
                                    ${new Date(item.time).toLocaleString()}

                                </div>

                            </div>

                        </div>
                    `;

                })
                .join("");

    } catch {

        historyContent.innerHTML =
            `<div class="panel-empty">
                Kunde inte hämta historiken.
            </div>`;

    }
}


function openHistory(url) {

    openThroughProxy(url);

}


/* =========================================
   BOOKMARKS
========================================= */

async function loadBookmarks() {

    bookmarksContent.innerHTML =
        `<div class="panel-empty">
            Laddar...
        </div>`;

    try {

        const response =
            await fetch(
                "/api/session"
            );

        const data =
            await response.json();

        const bookmarks =
            data.bookmarks || [];

        if (!bookmarks.length) {

            bookmarksContent.innerHTML =
                `<div class="panel-empty">
                    Inga bokmärken ännu.
                </div>`;

            return;
        }

        bookmarksContent.innerHTML =
            bookmarks
                .map(item => {

                    const safeTitle =
                        escapeHtml(
                            item.title
                        );

                    const safeUrl =
                        escapeHtml(
                            item.url
                        );

                    return `
                        <div class="panel-item">

                            <div
                                class="panel-item-main"
                                onclick="openBookmark(${JSON.stringify(item.url)})">

                                <div class="panel-item-title">

                                    ${safeTitle}

                                </div>

                                <div class="panel-item-url">

                                    ${safeUrl}

                                </div>

                            </div>

                        </div>
                    `;

                })
                .join("");

    } catch {

        bookmarksContent.innerHTML =
            `<div class="panel-empty">
                Kunde inte hämta bokmärken.
            </div>`;

    }
}


function openBookmark(url) {

    openThroughProxy(url);

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================
   START
========================================= */

input.focus();

</script>

</body>
</html>
