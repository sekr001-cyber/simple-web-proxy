<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Proxy</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #fff;
    color: #202124;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    padding: 0 28px;

    border-bottom: 1px solid #f1f3f4;
}

.nav {
    display: flex;
    align-items: center;
    gap: 22px;
}

.nav button {
    border: 0;
    background: transparent;

    color: #202124;

    font-size: 14px;

    cursor: pointer;
}

.nav button:hover {
    text-decoration: underline;
}

/* MAIN */

main {
    width: min(760px, calc(100% - 32px));

    margin: 0 auto;

    padding-top: 145px;

    text-align: center;
}

/* LOGO */

.logo {
    margin-bottom: 32px;

    font-size: 62px;
    font-weight: 500;

    letter-spacing: -4px;
}

.logo .s1 {
    color: #4285f4;
}

.logo .s2 {
    color: #ea4335;
}

.logo .s3 {
    color: #fbbc05;
}

.logo .s4 {
    color: #4285f4;
}

.logo .s5 {
    color: #34a853;
}

.logo .s6 {
    color: #ea4335;
}

.logo .proxy {
    color: #202124;
    letter-spacing: -2px;
}

/* SEARCH */

.search-wrapper {
    position: relative;
}

.search-box {
    height: 52px;

    display: flex;
    align-items: center;

    padding: 0 8px 0 18px;

    border: 1px solid #dfe1e5;
    border-radius: 28px;

    background: #fff;

    box-shadow:
        0 1px 6px rgba(32, 33, 36, .15);

    transition:
        box-shadow .15s ease;
}

.search-box:hover,
.search-box:focus-within {
    box-shadow:
        0 1px 10px rgba(32, 33, 36, .22);
}

.search-icon {
    color: #9aa0a6;

    font-size: 19px;

    margin-right: 12px;
}

#search {
    flex: 1;

    min-width: 0;

    height: 100%;

    border: 0;
    outline: 0;

    background: transparent;

    color: #202124;

    font-size: 16px;
}

#search::placeholder {
    color: #80868b;
}

.clear-button {
    display: none;

    width: 36px;
    height: 36px;

    border: 0;

    background: transparent;

    color: #5f6368;

    font-size: 20px;

    cursor: pointer;
}

.clear-button.visible {
    display: block;
}

/* BUTTONS */

.buttons {
    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 28px;
}

.buttons button {
    min-width: 130px;

    padding: 10px 18px;

    border: 1px solid #f8f9fa;
    border-radius: 4px;

    background: #f8f9fa;

    color: #202124;

    font-size: 14px;

    cursor: pointer;
}

.buttons button:hover {
    border-color: #dadce0;

    box-shadow:
        0 1px 1px rgba(0, 0, 0, .1);
}

/* SEARCH ENGINE CHOICE */

.engines {
    margin-top: 30px;

    color: #70757a;

    font-size: 13px;
}

.engine-buttons {
    display: flex;

    justify-content: center;

    gap: 8px;

    margin-top: 10px;
}

.engine-buttons button {
    border: 0;

    background: transparent;

    color: #4285f4;

    cursor: pointer;

    font-size: 13px;

    padding: 5px 8px;
}

.engine-buttons button:hover {
    text-decoration: underline;
}

/* STATUS */

#status {
    min-height: 20px;

    margin-top: 30px;

    color: #70757a;

    font-size: 13px;
}

/* FOOTER */

footer {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f2f2f2;

    border-top: 1px solid #dadce0;

    color: #70757a;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 0 16px;
    }

    main {
        padding-top: 95px;
    }

    .logo {
        font-size: 48px;
    }

    .buttons {
        flex-direction: column;
        align-items: center;
    }

    .buttons button {
        width: 200px;
    }

    .engine-buttons {
        flex-wrap: wrap;
    }
}

</style>
</head>

<body>

<header>

    <div class="nav">

        <button onclick="showHistory()">
            Historik
        </button>

        <button onclick="showBookmarks()">
            Bokmärken
        </button>

        <button onclick="checkStatus()">
            Status
        </button>

    </div>

</header>


<main>

    <div class="logo">

        <span class="s1">S</span><span class="s2">i</span><span class="s3">m</span><span class="s4">p</span><span class="s5">l</span><span class="s6">e</span>

        <span class="proxy">
            Proxy
        </span>

    </div>


    <form id="searchForm">

        <div class="search-wrapper">

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    id="search"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Sök eller skriv en webbadress"
                >

                <button
                    id="clearButton"
                    class="clear-button"
                    type="button"
                    aria-label="Rensa">
                    ×
                </button>

            </div>

        </div>

    </form>


    <div class="buttons">

        <button onclick="searchDuckDuckGo()">
            DuckDuckGo
        </button>

        <button onclick="openInputAsUrl()">
            Öppna URL
        </button>

        <button onclick="openExample()">
            Testa proxyn
        </button>

    </div>


    <div class="engines">

        Sök med

        <div class="engine-buttons">

            <button onclick="searchDuckDuckGo()">
                DuckDuckGo
            </button>

            <button onclick="searchBing()">
                Bing
            </button>

        </div>

    </div>


    <div id="status">
        Sök på webben eller öppna en webbadress genom proxyn.
    </div>

</main>


<footer>
    Simple Proxy · V21
</footer>


<script>

const input =
    document.getElementById("search");

const form =
    document.getElementById("searchForm");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");


/* =========================
   INPUT
========================= */

function getValue() {

    return input.value.trim();

}


/* =========================
   URL DETECTION
========================= */

function isUrl(value) {

    if (!value) {
        return false;
    }

    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {
        return true;
    }

    if (
        value.includes(".") &&
        !value.includes(" ")
    ) {
        return true;
    }

    return false;

}


function normalizeUrl(value) {

    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {
        return value;
    }

    return "https://" + value;

}


/* =========================
   PROXY URL
========================= */

function openThroughProxy(url) {

    window.location.href =
        "/proxy?url=" +
        encodeURIComponent(url);

}


/* =========================
   FORM
========================= */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const value =
            getValue();

        if (!value) {

            input.focus();

            return;
        }

        if (isUrl(value)) {

            openThroughProxy(
                normalizeUrl(value)
            );

            return;
        }

        searchDuckDuckGo();

    }
);


/* =========================
   DUCKDUCKGO
========================= */

function searchDuckDuckGo() {

    const query =
        getValue();

    if (!query) {

        input.focus();

        return;
    }

    const url =
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(query);

    status.textContent =
        "Öppnar DuckDuckGo genom proxyn...";

    openThroughProxy(url);

}


/* =========================
   BING
========================= */

function searchBing() {

    const query =
        getValue();

    if (!query) {

        input.focus();

        return;
    }

    const url =
        "https://www.bing.com/search?q=" +
        encodeURIComponent(query);

    status.textContent =
        "Öppnar Bing genom proxyn...";

    openThroughProxy(url);

}


/* =========================
   OPEN URL
========================= */

function openInputAsUrl() {

    const value =
        getValue();

    if (!value) {

        input.focus();

        return;
    }

    if (!isUrl(value)) {

        status.textContent =
            "Det ser inte ut som en webbadress.";

        return;
    }

    openThroughProxy(
        normalizeUrl(value)
    );

}


/* =========================
   EXAMPLE
========================= */

function openExample() {

    openThroughProxy(
        "https://example.com/"
    );

}


/* =========================
   CLEAR
========================= */

input.addEventListener(
    "input",
    function() {

        clearButton.classList.toggle(
            "visible",
            Boolean(input.value)
        );

    }
);

clearButton.addEventListener(
    "click",
    function() {

        input.value = "";

        clearButton.classList.remove(
            "visible"
        );

        input.focus();

    }
);


/* =========================
   STATUS
========================= */

async function checkStatus() {

    status.textContent =
        "Kontrollerar servern...";

    try {

        const response =
            await fetch(
                "/health",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        status.textContent =
            `Server online · ${data.version} · uptime ${data.uptime}s`;

    } catch {

        status.textContent =
            "Kunde inte kontakta servern.";

    }

}


/* =========================
   HISTORY
========================= */

async function showHistory() {

    try {

        const response =
            await fetch(
                "/api/session"
            );

        const data =
            await response.json();

        const history =
            data.history || [];

        if (!history.length) {

            alert(
                "Ingen historik ännu."
            );

            return;
        }

        alert(
            history
                .slice(0, 10)
                .map(
                    item =>
                        `${item.status} · ${item.url}`
                )
                .join("\n\n")
        );

    } catch {

        alert(
            "Kunde inte hämta historiken."
        );

    }

}


/* =========================
   BOOKMARKS
========================= */

async function showBookmarks() {

    try {

        const response =
            await fetch(
                "/api/session"
            );

        const data =
            await response.json();

        const bookmarks =
            data.bookmarks || [];

        if (!bookmarks.length) {

            alert(
                "Inga bokmärken ännu."
            );

            return;
        }

        alert(
            bookmarks
                .map(
                    item =>
                        `${item.title}\n${item.url}`
                )
                .join("\n\n")
        );

    } catch {

        alert(
            "Kunde inte hämta bokmärken."
        );

    }

}


/* =========================
   START
========================= */

input.focus();

</script>

</body>
</html>
