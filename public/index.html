<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Proxy</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #fff;

    color: #202124;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   HEADER
========================= */

header {

    height: 64px;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    padding: 0 24px;

    border-bottom: 1px solid #f1f3f4;
}

.header-links {

    display: flex;
    align-items: center;

    gap: 22px;

    font-size: 14px;
}

.header-links button {

    border: 0;

    background: transparent;

    color: #202124;

    cursor: pointer;

    font-size: 14px;
}

.header-links button:hover {

    text-decoration: underline;
}


/* =========================
   MAIN
========================= */

main {

    width: 100%;

    max-width: 800px;

    margin: 0 auto;

    padding: 150px 20px 80px;

    text-align: center;
}


/* =========================
   LOGO
========================= */

.logo {

    margin-bottom: 34px;

    font-size: 64px;

    font-weight: 500;

    letter-spacing: -4px;
}

.logo .blue {
    color: #4285f4;
}

.logo .red {
    color: #ea4335;
}

.logo .yellow {
    color: #fbbc05;
}

.logo .green {
    color: #34a853;
}


/* =========================
   SEARCH
========================= */

.search-box {

    width: 100%;

    height: 50px;

    display: flex;
    align-items: center;

    border: 1px solid #dfe1e5;

    border-radius: 25px;

    padding: 0 16px;

    box-shadow:
        0 1px 6px rgba(32,33,36,.15);

    transition:
        box-shadow .15s,
        border-color .15s;
}

.search-box:hover,
.search-box:focus-within {

    box-shadow:
        0 1px 8px rgba(32,33,36,.25);
}

.search-icon {

    color: #9aa0a6;

    font-size: 20px;

    margin-right: 12px;
}

#search {

    flex: 1;

    height: 100%;

    border: 0;

    outline: 0;

    font-size: 16px;

    color: #202124;

    background: transparent;
}

.search-button {

    height: 36px;

    padding: 0 17px;

    border: 0;

    border-radius: 4px;

    background: #f8f9fa;

    color: #202124;

    cursor: pointer;

    font-size: 14px;
}

.search-button:hover {

    border: 1px solid #dadce0;

    box-shadow:
        0 1px 1px rgba(0,0,0,.1);
}


/* =========================
   BUTTONS
========================= */

.buttons {

    margin-top: 28px;

    display: flex;

    justify-content: center;

    gap: 12px;
}

.buttons button {

    padding: 10px 18px;

    border: 1px solid #f8f9fa;

    border-radius: 4px;

    background: #f8f9fa;

    color: #202124;

    cursor: pointer;

    font-size: 14px;
}

.buttons button:hover {

    border-color: #dadce0;

    box-shadow:
        0 1px 1px rgba(0,0,0,.1);
}


/* =========================
   INFO
========================= */

.info {

    margin-top: 55px;

    color: #70757a;

    font-size: 13px;
}

.info span {

    color: #4285f4;
}


/* =========================
   SEARCH RESULTS
========================= */

#results {

    display: none;

    text-align: left;

    margin-top: 55px;
}

.result {

    margin-bottom: 30px;
}

.result-url {

    color: #188038;

    font-size: 13px;

    margin-bottom: 4px;

    word-break: break-all;
}

.result-title {

    color: #1a0dab;

    font-size: 20px;

    margin-bottom: 5px;

    cursor: pointer;
}

.result-title:hover {

    text-decoration: underline;
}

.result-description {

    color: #4d5156;

    font-size: 14px;

    line-height: 1.5;

    max-width: 650px;
}

.search-meta {

    color: #70757a;

    font-size: 13px;

    margin-bottom: 25px;
}


/* =========================
   FOOTER
========================= */

footer {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-top: 1px solid #dadce0;

    background: #f2f2f2;

    color: #70757a;

    font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        padding: 0 15px;
    }

    main {
        padding-top: 100px;
    }

    .logo {
        font-size: 48px;
    }

    .search-box {
        height: 48px;
    }

    .search-button {
        display: none;
    }

    .buttons {
        flex-direction: column;
        align-items: center;
    }

    .buttons button {
        width: 180px;
    }
}

</style>

</head>

<body>


<header>

    <div class="header-links">

        <button onclick="showBookmarks()">
            Bokmärken
        </button>

        <button onclick="showHistory()">
            Historik
        </button>

        <button onclick="health()">
            Status
        </button>

    </div>

</header>


<main>

    <div class="logo">

        <span class="blue">S</span><span class="red">i</span><span class="yellow">m</span><span class="blue">p</span><span class="green">l</span><span class="red">e</span>

        <span style="color:#202124">
            Proxy
        </span>

    </div>


    <form id="searchForm">

        <div class="search-box">

            <div class="search-icon">
                🔍
            </div>

            <input
                id="search"
                autocomplete="off"
                placeholder="Sök eller skriv en webbadress"
            >

            <button
                class="search-button"
                type="submit">

                Sök

            </button>

        </div>

    </form>


    <div class="buttons">

        <button onclick="focusSearch()">
            Sök
        </button>

        <button onclick="openExample()">
            Testa proxyn
        </button>

    </div>


    <div
        class="info"
        id="info">

        Sök på webben eller öppna en URL genom proxyn.

        <br><br>

        <span>
            V20
        </span>

    </div>


    <div id="results"></div>

</main>


<footer>

    Simple Proxy · V20

</footer>


<script>


const searchInput =
    document.getElementById("search");

const searchForm =
    document.getElementById("searchForm");

const results =
    document.getElementById("results");

const info =
    document.getElementById("info");


/* =========================
   INPUT
========================= */

function getInputType(value) {

    value = value.trim();

    if (!value) {
        return null;
    }

    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        return {
            type: "url",
            value
        };
    }

    if (
        value.includes(".") &&
        !value.includes(" ")
    ) {

        return {
            type: "url",
            value:
                "https://" + value
        };
    }

    return {
        type: "search",
        value
    };
}


/* =========================
   SUBMIT
========================= */

searchForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const input =
            getInputType(
                searchInput.value
            );

        if (!input) {
            return;
        }

        if (input.type === "url") {

            window.location.href =
                "/proxy?url=" +
                encodeURIComponent(
                    input.value
                );

            return;
        }

        await search(
            input.value
        );
    }
);


/* =========================
   SEARCH
========================= */

async function search(query) {

    info.textContent =
        "Söker...";

    results.style.display =
        "none";

    try {

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    query
                )
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Search failed"
            );
        }

        renderResults(
            data.results,
            query
        );

    } catch (error) {

        console.error(error);

        info.textContent =
            "Kunde inte genomföra sökningen.";

    }
}


/* =========================
   RESULTS
========================= */

function renderResults(
    items,
    query
) {

    info.textContent =
        `${items.length} resultat för "${query}"`;

    results.style.display =
        "block";

    if (!items.length) {

        results.innerHTML = `
            <div class="search-meta">
                Inga resultat hittades.
            </div>
        `;

        return;
    }

    results.innerHTML =
        items.map(item => {

            const safeTitle =
                escapeHtml(
                    item.title
                );

            const safeUrl =
                escapeHtml(
                    item.url
                );

            const safeDescription =
                escapeHtml(
                    item.description ||
                    ""
                );

            return `
                <div class="result">

                    <div class="result-url">
                        ${safeUrl}
                    </div>

                    <div
                        class="result-title"
                        onclick="openResult(${JSON.stringify(item.url)})">

                        ${safeTitle}

                    </div>

                    <div class="result-description">

                        ${safeDescription}

                    </div>

                </div>
            `;

        }).join("");
}


function openResult(url) {

    window.location.href =
        "/proxy?url=" +
        encodeURIComponent(url);
}


/* =========================
   EXAMPLE
========================= */

function openExample() {

    window.location.href =
        "/proxy?url=" +
        encodeURIComponent(
            "https://example.com/"
        );
}


/* =========================
   SEARCH FOCUS
========================= */

function focusSearch() {

    searchInput.focus();
}


/* =========================
   STATUS
========================= */

async function health() {

    try {

        const response =
            await fetch(
                "/health",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        alert(
            `Server online\nVersion: ${data.version}\nUptime: ${data.uptime}s`
        );

    } catch {

        alert(
            "Servern kunde inte kontaktas."
        );
    }
}


/* =========================
   SESSION
========================= */

async function showHistory() {

    try {

        const response =
            await fetch(
                "/api/session"
            );

        const data =
            await response.json();

        const history =
            data.history || [];

        if (!history.length) {

            alert(
                "Ingen historik ännu."
            );

            return;
        }

        alert(
            history
                .slice(0, 10)
                .map(
                    item =>
                        `${item.status} · ${item.url}`
                )
                .join("\n\n")
        );

    } catch {

        alert(
            "Kunde inte hämta historiken."
        );
    }
}


async function showBookmarks() {

    try {

        const response =
            await fetch(
                "/api/session"
            );

        const data =
            await response.json();

        const bookmarks =
            data.bookmarks || [];

        if (!bookmarks.length) {

            alert(
                "Inga bokmärken ännu."
            );

            return;
        }

        alert(
            bookmarks
                .map(
                    item =>
                        `${item.title}\n${item.url}`
                )
                .join("\n\n")
        );

    } catch {

        alert(
            "Kunde inte hämta bokmärken."
        );
    }
}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}

</script>

</body>
</html>
