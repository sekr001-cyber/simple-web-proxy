<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Web Proxy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f172a;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            width: min(650px, 90%);
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;

            padding: 15px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 25px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            margin-top: 20px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Web Proxy</h1>

    <p>
        Enter a website URL below
    </p>

    <form id="proxyForm">

        <input
            id="url"
            type="url"
            placeholder="https://example.com"
            required
        >

        <button type="submit">
            Go
        </button>

    </form>

    <div class="status">
        Simple Proxy V1
    </div>

</div>

<script>
    const form = document.getElementById("proxyForm");
    const input = document.getElementById("url");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const url = input.value.trim();

        if (!url) {
            return;
        }

        const proxyUrl =
            "/proxy?url=" +
            encodeURIComponent(url);

        window.location.href = proxyUrl;
    });
</script>

</body>
</html>
